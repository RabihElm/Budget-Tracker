<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Budget Tracker</h1>

    <!-- Month switcher: everything below shows only the month in the middle -->
    <nav class="month-nav">
      <button type="button" id="prev-month" aria-label="Previous month">&lsaquo;</button>
      <h2 id="month-label"></h2>
      <button type="button" id="next-month" aria-label="Next month">&rsaquo;</button>
    </nav>

    <!-- Circles: balance vs expenses. The bigger amount gets the bigger circle. -->
    <section class="circles">
      <div id="balance-circle" class="circle circle-balance">
        <span class="circle-label">Balance</span>
        <span id="balance" class="circle-value">$0.00</span>
      </div>
      <div id="expenses-circle" class="circle circle-expenses">
        <span class="circle-label">Expenses</span>
        <span id="total-expenses" class="circle-value">$0.00</span>
      </div>
    </section>

    <!-- Income: shown smaller, underneath the circles -->
    <p class="income-line">
      Income: <span id="total-income" class="income">$0.00</span>
    </p>

    <!-- Spending meter: a bar that fills up as expenses eat into income -->
    <section class="meter">
      <div class="meter-header">
        <span class="meter-label">Spending</span>
        <span id="meter-percent" class="meter-percent">0%</span>
      </div>
      <div class="meter-track">
        <div id="meter-fill" class="meter-fill"></div>
      </div>
      <p id="meter-message" class="meter-message"></p>
    </section>

    <!-- Form: how the user adds a new transaction -->
    <form id="transaction-form" class="form">
      <input
        type="text"
        id="description"
        placeholder="Description (e.g. Groceries)"
        required
      >
      <input
        type="number"
        id="amount"
        placeholder="Amount"
        step="0.01"
        min="0"
        required
      >
      <select id="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
      <input type="date" id="date" required>
      <label class="recurring-option">
        <input type="checkbox" id="recurring">
        Repeats every month
      </label>
      <button type="submit" id="submit-btn">Add</button>
      <!-- Only shown while editing ("hidden" hides it until JS removes it) -->
      <button type="button" id="cancel-edit" class="cancel-btn" hidden>Cancel</button>
    </form>

    <!-- List: every transaction added shows up here -->
    <ul id="transaction-list" class="list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
